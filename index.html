<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koşu Veri Toplayıcı</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; margin: 15px auto; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 15px 25px; font-size: 16px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; width: 80%; font-weight: bold; }
        #btnHr { background-color: #e74c3c; }
        #btnStart { background-color: #2ecc71; }
        #btnStop { background-color: #34495e; display: none; }
        .val { font-size: 24px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sensör Bağlantıları</h2>
        <button id="btnHr">1. Nabız Bandına Bağlan</button>
        <button id="btnStart">2. GPS ve Kaydı Başlat</button>
        <button id="btnStop">3. Kaydı Bitir ve CSV İndir</button>
    </div>

    <div class="card">
        <p>Güncel Nabız: <span class="val" id="valHr">--</span> BPM</p>
        <p>GPS Enlem: <span class="val" id="valLat">--</span></p>
        <p>GPS Boylam: <span class="val" id="valLon">--</span></p>
        <p>Hız: <span class="val" id="valSpeed">0</span> km/s</p>
        <p>Kayıt Süresi: <span class="val" id="valCount">0</span> sn</p>
    </div>

    <script>
        let currentHr = null;
        let currentLat = null;
        let currentLon = null;
        let currentAlt = null;
        let currentSpeed = null;

        let watchId = null;
        let loggingInterval = null;
        let logData = [];
        let secondsElapsed = 0; // Geçen süreyi tutacağımız sayaç

        // Sesli Asistan Fonksiyonu
        function sesliOku(metin) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(metin);
                utterance.lang = 'tr-TR'; // Türkçe okuması için
                utterance.rate = 1.0;     // Konuşma hızı
                window.speechSynthesis.speak(utterance);
            }
        }

        // BLE Nabız Bağlantısı
        document.getElementById('btnHr').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['heart_rate'] }]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('heart_rate');
                const characteristic = await service.getCharacteristic('heart_rate_measurement');
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    const flags = value.getUint8(0);
                    currentHr = (flags & 0x1) ? value.getUint16(1, true) : value.getUint8(1);
                    document.getElementById('valHr').innerText = currentHr;
                });
                
                document.getElementById('btnHr').innerText = "Nabız Bandı Bağlandı";
                document.getElementById('btnHr').style.backgroundColor = "#27ae60";
                sesliOku("Nabız sensörü bağlandı.");
            } catch (error) {
                alert("Bağlantı Hatası: " + error);
            }
        });

        // GPS ve Loglama Başlatma
        document.getElementById('btnStart').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("Tarayıcınız GPS desteklemiyor.");
                return;
            }

            // Tarayıcı güvenlik kısıtlamasını aşmak için ilk tıklandığında boş bir ses çalıyoruz
            if ('speechSynthesis' in window) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            }

            sesliOku("Antrenman başlatılıyor. İyi koşular.");

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentLat = pos.coords.latitude.toFixed(6);
                    currentLon = pos.coords.longitude.toFixed(6);
                    currentAlt = pos.coords.altitude ? pos.coords.altitude.toFixed(1) : "";
                    currentSpeed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : "0";
                    
                    document.getElementById('valLat').innerText = currentLat;
                    document.getElementById('valLon').innerText = currentLon;
                    document.getElementById('valSpeed').innerText = currentSpeed;
                },
                (err) => console.error(err),
                { enableHighAccuracy: true, maximumAge: 0 }
            );

            loggingInterval = setInterval(() => {
                const now = new Date();
                const isoZaman = now.toISOString();
                
                logData.push({
                    Time: isoZaman,
                    Latitude: currentLat,
                    Longitude: currentLon,
                    Altitude: currentAlt,
                    Speed_kmh: currentSpeed,
                    HeartRate: currentHr
                });
                
                secondsElapsed++;
                document.getElementById('valCount').innerText = secondsElapsed;

                // HER 60 SANİYEDE BİR BİLGİ VER
                if (secondsElapsed > 0 && secondsElapsed % 60 === 0) {
                    let dakika = secondsElapsed / 60;
                    let duyuru = `Geçen süre ${dakika} dakika. `;
                    if (currentHr) duyuru += `Nabız ${currentHr}. `;
                    if (currentSpeed > 0) duyuru += `Hız saatte ${currentSpeed} kilometre.`;
                    
                    sesliOku(duyuru);
                }

            }, 1000);

            document.getElementById('btnStart').style.display = "none";
            document.getElementById('btnStop').style.display = "inline-block";
        });

        // Kaydı Bitir ve İndir
        document.getElementById('btnStop').addEventListener('click', () => {
            clearInterval(loggingInterval);
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            
            sesliOku("Antrenman bitirildi. Veriler kaydediliyor.");

            let csvContent = "data:text/csv;charset=utf-8,Time,Latitude,Longitude,Altitude,Speed_kmh,HeartRate\n";
            logData.forEach(row => {
                csvContent += `${row.Time},${row.Latitude},${row.Longitude},${row.Altitude},${row.Speed_kmh},${row.HeartRate}\n`;
            });

            const now = new Date();
            const tarihFormatli = now.getFullYear() + "-" + 
                String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                String(now.getDate()).padStart(2, '0') + "_" + 
                String(now.getHours()).padStart(2, '0') + "-" + 
                String(now.getMinutes()).padStart(2, '0');

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Kosu_Log_${tarihFormatli}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            document.getElementById('btnStop').innerText = "Kayıt Tamamlandı";
        });
    </script>
</body>
</html>
