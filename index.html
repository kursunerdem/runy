<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biyomekanik Kayıt</title>
    <!-- Ekranın uyumasını engelleyen NoSleep.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 10px; background-color: #f4f4f9; color: #333; touch-action: manipulation; }
        .card { background: white; margin: 10px auto; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .input-group label { font-size: 15px; font-weight: bold; color: #2c3e50; display: flex; justify-content: space-between; align-items: center;}
        .highlight { color: #e74c3c; font-size: 20px; font-weight: 900; }
        
        input[type=range] { width: 100%; height: 12px; -webkit-appearance: none; background: #dcdde1; outline: none; border-radius: 10px; margin: 15px 0 5px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; border-radius: 50%; background: #3498db; cursor: pointer; }

        button { padding: 15px 25px; font-size: 16px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; color: white; width: 100%; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #btnHr { background-color: #e74c3c; } #btnStart { background-color: #2ecc71; } #btnStop { background-color: #34495e; display: none; } #btnPocket { background-color: #000; display: none; border: 1px solid #555; }
        
        .grid { display: flex; flex-wrap: wrap; justify-content: space-between; }
        .stat { width: 45%; background: #ecf0f1; margin-bottom: 10px; padding: 10px; border-radius: 5px; box-sizing: border-box; }
        .val { font-size: 22px; font-weight: bold; color: #2980b9; display: block; margin-top: 5px; }
        #hfStatus { color: #e67e22; font-size: 12px; font-weight: bold; margin-top: 10px; display: none; }

        /* ZİFİRİ SİYAH CEP MODU KATMANI (Tam Ekran Koruması) */
        #pocketOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; user-select: none; touch-action: none; }
        #unlockBtn { width: 120px; height: 120px; border-radius: 50%; background-color: #222; border: 4px solid #444; color: #555; font-size: 40px; display: flex; justify-content: center; align-items: center; transition: all 0.2s; user-select: none; touch-action: none; }
        .pocket-text { color: #444; font-size: 12px; margin-top: 20px; font-weight: bold; text-align: center; padding: 0 20px;}
        .unlocking { background-color: #e74c3c !important; border-color: #c0392b !important; color: #fff !important; transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- CEP MODU OVERLAY -->
    <div id="pocketOverlay">
        <div id="unlockBtn">🔒</div>
        <div class="pocket-text">KİLİDİ AÇMAK İÇİN 3 SANİYE BASILI TUT</div>
    </div>

    <div class="card" id="settingsCard">
        <h3>Hedefler & Alarmlar</h3>
        <div class="input-group">
            <label>Minimum Kadans: <span id="lblCadence" class="highlight">170</span></label>
            <input type="range" id="inpCadence" min="0" max="220" step="1" value="170">
        </div>
        <div class="input-group">
            <label>Max Nabız Limiti: <span id="lblHr" class="highlight">140</span></label>
            <input type="range" id="inpHr" min="0" max="200" step="1" value="140">
        </div>
        <div class="input-group">
            <label>Hedef Pace: <span id="lblPace" class="highlight">05:30</span></label>
            <input type="range" id="inpPace" min="0" max="600" step="5" value="330">
        </div>
    </div>

    <div class="card">
        <button id="btnHr">Nabız Bandına Bağlan</button>
        <button id="btnStart">GPS & Kaydı Başlat</button>
        <button id="btnPocket">Ekranı Kilitle (Cep Modu)</button>
        <button id="btnStop">Kaydı Bitir ve İndir</button>
        <div id="hfStatus">Biyomekanik Veri Kaydediliyor (60Hz) 🔴</div>
    </div>

    <div class="card grid" id="dataCard">
        <div class="stat">Nabız<span class="val" id="valHr">--</span></div>
        <div class="stat">Kadans<span class="val" id="valCadence">--</span></div>
        <div class="stat">Pace<span class="val" id="valPace">--:--</span></div>
        <div class="stat">Süre<span class="val" id="valCount">0 sn</span></div>
    </div>

    <script>
        // --- ARAYÜZ ---
        document.getElementById('inpCadence').addEventListener('input', function() { document.getElementById('lblCadence').innerText = this.value == 0 ? "Kapalı" : this.value; });
        document.getElementById('inpHr').addEventListener('input', function() { document.getElementById('lblHr').innerText = this.value == 0 ? "Kapalı" : this.value; });
        document.getElementById('inpPace').addEventListener('input', function() { 
            if(this.value == 0) { document.getElementById('lblPace').innerText = "Kapalı"; return; }
            let m = Math.floor(this.value / 60); let s = this.value % 60; document.getElementById('lblPace').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        });

        function getPaceString(speedKmh) {
            if (!speedKmh || speedKmh < 1.5) return "--:--";
            let paceSec = Math.round(3600 / speedKmh);
            let m = Math.floor(paceSec / 60); let s = paceSec % 60; return `${m}:${s.toString().padStart(2, '0')}`;
        }
        function sesliOku(metin) { if ('speechSynthesis' in window) { const utterance = new SpeechSynthesisUtterance(metin); utterance.lang = 'tr-TR'; window.speechSynthesis.speak(utterance); } }
        function downloadCSV(csvContent, filename) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob);
            const link = document.createElement("a"); link.setAttribute("href", url); link.setAttribute("download", filename);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        // --- TAM EKRAN (FULLSCREEN) YÖNETİMİ ---
        function enterFullscreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }
        function exitFullscreen() {
            if (document.exitFullscreen) { document.exitFullscreen(); }
            else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        }

        // --- DEĞİŞKENLER & NOSLEEP MOTORU ---
        let isRunning = false; let watchId = null; let loggingInterval = null; let secondsElapsed = 0;
        let currentHr = null, currentLat = null, currentLon = null, currentAlt = null, currentSpeedKmh = 0, currentCadence = 0;
        let lastPeakTime = 0, stepTimestamps = [];
        let standardLogData = ["Time,Latitude,Longitude,Altitude,Speed_kmh,Pace,Cadence,HeartRate"];
        let biomechanicsLogData = ["Timestamp_ms,AccX,AccY,AccZ,GyroX,GyroY,GyroZ"];
        
        const noSleep = new NoSleep(); 

        // --- BLE NABIZ BANDI BAĞLANTISI ---
        document.getElementById('btnHr').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
                document.getElementById('btnHr').innerText = "Bağlanıyor...";
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('heart_rate');
                const characteristic = await service.getCharacteristic('heart_rate_measurement');
                
                await characteristic.startNotifications();
                
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value; const flags = value.getUint8(0); const format = flags & 0x01;
                    let hr = (format === 0) ? value.getUint8(1) : value.getUint16(1, true);
                    
                    currentHr = hr; document.getElementById('valHr').innerText = hr;
                    
                    let btn = document.getElementById('btnHr');
                    btn.innerText = `Nabız Bağlı: ♥ ${hr}`; btn.style.backgroundColor = "#2ecc71"; btn.style.borderColor = "#27ae60";
                });
                sesliOku('Nabız sensörü bağlandı.');
            } catch (error) {
                console.error("Bluetooth hatası:", error);
                alert("Bağlantı kurulamadı. Tarayıcı izinlerini ve cihazı kontrol edin.");
                document.getElementById('btnHr').innerText = "Nabız Bandına Bağlan";
            }
        });

        // --- CEP MODU (POCKET MODE) MANTIĞI ---
        const pocketOverlay = document.getElementById('pocketOverlay');
        const unlockBtn = document.getElementById('unlockBtn');
        let unlockTimer;

        document.getElementById('btnPocket').addEventListener('click', () => {
            enterFullscreen(); pocketOverlay.style.display = "flex"; sesliOku("Cep modu aktif.");
        });

        function startUnlock() {
            unlockBtn.classList.add('unlocking');
            unlockTimer = setTimeout(() => {
                pocketOverlay.style.display = "none"; unlockBtn.classList.remove('unlocking'); exitFullscreen(); sesliOku("Kilit açıldı.");
            }, 3000);
        }
        function cancelUnlock() { clearTimeout(unlockTimer); unlockBtn.classList.remove('unlocking'); }

        unlockBtn.addEventListener('mousedown', startUnlock);
        unlockBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startUnlock(); }, {passive: false});
        unlockBtn.addEventListener('mouseup', cancelUnlock);
        unlockBtn.addEventListener('mouseleave', cancelUnlock);
        unlockBtn.addEventListener('touchend', (e) => { e.preventDefault(); cancelUnlock(); }, {passive: false});

        // --- 60HZ SENSÖR MOTORU ---
        window.addEventListener('devicemotion', (e) => {
            if (!isRunning) return;
            let acc = e.accelerationIncludingGravity; let gyro = e.rotationRate; let now = performance.now();
            if (acc && acc.x !== null) {
                let ax = acc.x.toFixed(3), ay = acc.y.toFixed(3), az = acc.z.toFixed(3);
                let gx = gyro && gyro.alpha ? gyro.alpha.toFixed(3) : 0, gy = gyro && gyro.beta ? gyro.beta.toFixed(3) : 0, gz = gyro && gyro.gamma ? gyro.gamma.toFixed(3) : 0;
                biomechanicsLogData.push(`${now.toFixed(0)},${ax},${ay},${az},${gx},${gy},${gz}`);

                let mag = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2) - 9.81; let t = Date.now();
                if (Math.abs(mag) > 5 && (t - lastPeakTime > 250)) { stepTimestamps.push(t); lastPeakTime = t; }
            }
        });

        // --- BAŞLAT/DURDUR ---
        document.getElementById('btnStart').addEventListener('click', () => {
            if (!navigator.geolocation) { alert("GPS desteklenmiyor."); return; }
            noSleep.enable();
            if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

            document.getElementById('settingsCard').style.display = "none"; document.getElementById('hfStatus').style.display = "block";
            document.getElementById('btnStart').style.display = "none"; document.getElementById('btnStop').style.display = "inline-block";
            document.getElementById('btnPocket').style.display = "inline-block";
            
            sesliOku("Antrenman başladı.");
            isRunning = true;

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentLat = pos.coords.latitude.toFixed(6); currentLon = pos.coords.longitude.toFixed(6);
                    currentSpeedKmh = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(2) : 0;
                    document.getElementById('valPace').innerText = getPaceString(currentSpeedKmh);
                }, (err) => console.error(err), { enableHighAccuracy: true, maximumAge: 0 }
            );

            loggingInterval = setInterval(() => {
                secondsElapsed++; document.getElementById('valCount').innerText = secondsElapsed + " sn";
                let onSaniyeOnce = Date.now() - 10000; stepTimestamps = stepTimestamps.filter(t => t > onSaniyeOnce);
                currentCadence = stepTimestamps.length * 6; document.getElementById('valCadence').innerText = currentCadence;
                standardLogData.push(`${new Date().toISOString()},${currentLat},${currentLon},${currentAlt||0},${currentSpeedKmh},${getPaceString(currentSpeedKmh)},${currentCadence},${currentHr||0}`);
            }, 1000);
        });

        document.getElementById('btnStop').addEventListener('click', () => {
            isRunning = false; clearInterval(loggingInterval);
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            noSleep.disable(); exitFullscreen();
            
            document.getElementById('hfStatus').style.display = "none";
            sesliOku("Antrenman bitti. İki dosya indiriliyor.");

            const now = new Date();
            const tarih = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0') + "_" + String(now.getHours()).padStart(2, '0') + "-" + String(now.getMinutes()).padStart(2, '0');

            downloadCSV(standardLogData.join("\n"), `Kosu_Genel_${tarih}.csv`);
            setTimeout(() => { downloadCSV(biomechanicsLogData.join("\n"), `Biyomekanik_${tarih}.csv`); }, 500);
            
            document.getElementById('btnStop').innerText = "Kayıt Tamamlandı"; document.getElementById('btnPocket').style.display = "none";
        });
    </script>
</body>
</html>
